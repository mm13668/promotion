<div class="plugin-bottom-bar-1" id="plugin-bottom-bar-1">
    <div class="bar-item bar-phone" onclick="callPhone()" id="bar-phone">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
            </svg>
        </div>
        <span class="text">电话咨询</span>
    </div>
    <div class="bar-item bar-wechat" onclick="copyWechatBottom()" id="bar-wechat">
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
        </div>
        <span class="text">复制微信</span>
    </div>
</div>
<div class="plugin-bottom-assist" id="plugin-bottom-assist" style="display:none;">
    <a class="assist-btn" id="assist-btn-link" href="javascript:void(0)" onclick="openCustomerAssist()">
        <span class="assist-text">点此咨询 给您详细介绍</span>
        <svg class="assist-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
    </a>
</div>
<style>
.plugin-bottom-bar-1 {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: linear-gradient(180deg, #ffffff 0%, #f8f9fa 100%);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08), 0 -1px 3px rgba(0,0,0,0.05);
    display: flex;
    z-index: 9998;
    padding: 8px 16px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    gap: 12px;
}

.plugin-bottom-bar-1 .bar-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #333;
    text-decoration: none;
    cursor: pointer;
    border-radius: 12px;
    padding: 8px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    border: 1px solid #dee2e6;
    position: relative;
    overflow: hidden;
}

.plugin-bottom-bar-1 .bar-item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 100%);
    opacity: 0;
    transition: opacity 0.3s;
}

.plugin-bottom-bar-1 .bar-item:active::before {
    opacity: 1;
}

.plugin-bottom-bar-1 .bar-item:active {
    transform: scale(0.96);
}

.plugin-bottom-bar-1 .bar-item.bar-phone {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    border: none;
    color: #fff;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.plugin-bottom-bar-1 .bar-item.bar-phone:active {
    box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
}

.plugin-bottom-bar-1 .bar-item.bar-wechat {
    background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
    border: none;
    color: #fff;
    box-shadow: 0 4px 12px rgba(7, 193, 96, 0.3);
}

.plugin-bottom-bar-1 .bar-item.bar-wechat:active {
    box-shadow: 0 2px 6px rgba(7, 193, 96, 0.3);
}

.plugin-bottom-bar-1 .icon-wrapper {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 4px;
    border-radius: 8px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
}

.plugin-bottom-bar-1 .icon-wrapper svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
}

.plugin-bottom-bar-1 .text {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: inherit;
}

.plugin-bottom-assist {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
}

.plugin-bottom-assist .assist-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 52px;
    background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
    border-radius: 26px;
    box-shadow: 0 6px 20px rgba(7, 193, 96, 0.4);
    text-decoration: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    gap: 8px;
}

.plugin-bottom-assist .assist-btn:active {
    transform: scale(0.97);
    box-shadow: 0 3px 10px rgba(7, 193, 96, 0.3);
}

.plugin-bottom-assist .assist-text {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
}

.plugin-bottom-assist .assist-arrow {
    color: #fff;
    opacity: 0.9;
}

/* 移动端适配 */
@media (max-width: 480px) {
    .plugin-bottom-bar-1 {
        height: 65px;
        padding: 6px 12px;
        padding-bottom: max(6px, env(safe-area-inset-bottom));
        gap: 10px;
    }
    
    .plugin-bottom-bar-1 .bar-item {
        padding: 6px;
        border-radius: 10px;
    }
    
    .plugin-bottom-bar-1 .icon-wrapper {
        width: 28px;
        height: 28px;
        margin-bottom: 3px;
    }
    
    .plugin-bottom-bar-1 .icon-wrapper svg {
        width: 18px;
        height: 18px;
    }
    
    .plugin-bottom-bar-1 .text {
        font-size: 12px;
    }

    .plugin-bottom-assist {
        padding: 8px 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
    }

    .plugin-bottom-assist .assist-btn {
        height: 48px;
        border-radius: 24px;
    }

    .plugin-bottom-assist .assist-text {
        font-size: 15px;
    }
}
</style>
<script>
(function() {
    var preferAssist = window.preferCustomerAssist;
    console.log("preferAssist",preferAssist);

    if (preferAssist) {
        var bar = document.getElementById('plugin-bottom-bar-1');
        var assist = document.getElementById('plugin-bottom-assist');
        var linkEl = document.getElementById('assist-btn-link');
        if (bar) bar.style.display = 'none';
        if (assist) assist.style.display = 'block';
        if (linkEl) linkEl.href = window.currentService?.customerAssistLink || '#';
    }

    window.callPhone = function() {
        var phone = window.currentService?.mobile || window.phone;
        window.location.href = "tel:" + phone;
    }

    window.openCustomerAssist = function() {
        var link = window.currentService?.customerAssistLink;
        if (link) {
            if (window.LANDING_VISIT_ID) {
                fetch('/api/promotion/landingVisit/reportAssistClick', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: Number(window.LANDING_VISIT_ID),
                        servicePhone: window.currentService?.mobile || '',
                        serviceNickname: window.currentService?.nickname || ''
                    })
                }).catch(function() {});
            }
            window.location.href = link;
        }
    }

    window.copyWechatBottom = function() {
        var wechat = window.currentService?.wechat || window.wechat;
        var copyReported = localStorage.getItem('landing_copy_reported_' + window.location.pathname);

        function reportCopyEvent() {
            if (window.LANDING_VISIT_ID && !copyReported) {
                fetch('/api/promotion/landingVisit/reportCopy', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id: Number(window.LANDING_VISIT_ID),
                        servicePhone: window.currentService?.mobile || '',
                        serviceNickname: window.currentService?.nickname || ''
                    })
                }).then(function() {
                    localStorage.setItem('landing_copy_reported_' + window.location.pathname, 'true');
                }).catch(function() {
                    localStorage.setItem('landing_copy_reported_' + window.location.pathname, 'true');
                });
            }
        }

        if (navigator.clipboard) {
            navigator.clipboard.writeText(wechat).then(function() {
                if (window.showCopySuccessPopup) {
                    window.showCopySuccessPopup();
                } else {
                    alert('微信复制成功！');
                }
                reportCopyEvent();
            }).catch(function() {
                var input = document.createElement('input');
                input.value = wechat;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                if (window.showCopySuccessPopup) {
                    window.showCopySuccessPopup();
                } else {
                    alert('微信复制成功！');
                }
                reportCopyEvent();
            });
        } else {
            var input = document.createElement('input');
            input.value = wechat;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            if (window.showCopySuccessPopup) {
                window.showCopySuccessPopup();
            } else {
                alert('微信复制成功！');
            }
            reportCopyEvent();
        }
    }
})();
</script>
